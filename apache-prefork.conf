# Limiti di Apache (mpm_prefork + mod_php) dimensionati sul container (mem_limit 1g).
# Ogni processo = una richiesta con PHP caricato: ~50-60 MB reali sotto carico
# (RSS 75-115 MB, ma opcache da 128 MB è condivisa). 12 × ~60 MB + opcache ≈ 900 MB.
# Con il default (150 processi) un picco senza cache porta il container in OOM:
# così le richieste in eccesso aspettano in coda invece di far crashare il sito.
# Se si alza mem_limit nel compose, alzare MaxRequestWorkers in proporzione.

<IfModule mpm_prefork_module>
    StartServers             3
    MinSpareServers          2
    MaxSpareServers          5
    ServerLimit             12
    MaxRequestWorkers       12
    # Ricicla i processi ogni 1000 richieste: limita la crescita di memoria nel tempo.
    MaxConnectionsPerChild 1000
</IfModule>
