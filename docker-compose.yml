services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      wp_db:
        condition: service_healthy
      wp_redis:
        condition: service_started
    volumes:
      - wp_app:/var/www/html
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    environment:
      WORDPRESS_DB_HOST: wp_db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-0}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_MEMORY_LIMIT', '256M');
        define('DISALLOW_FILE_EDIT', true);
        define('WP_REDIS_HOST', 'wp_redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_PASSWORD', '${REDIS_PASSWORD}');
        define('WP_REDIS_PREFIX', '${WP_REDIS_PREFIX:-wp1}');
        define('WP_REDIS_DATABASE', ${WP_REDIS_DATABASE:-0});
    networks:
      - wpnet
      - dokploy-network
    mem_limit: 1g
    # Il dominio si assegna dalla UI di Dokploy (tab Domains) → service "wordpress", porta 80.
    # Traefik lo raggiunge tramite la rete esterna "dokploy-network".

  wp_db:
    image: mariadb:11.4
    restart: unless-stopped
    volumes:
      - wp_data:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - wpnet
    mem_limit: 1g

  wp_redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
    volumes:
      - wp_redis:/data
    networks:
      - wpnet
    mem_limit: 320m

volumes:
  wp_app:
  wp_data:
  wp_redis:

networks:
  wpnet:
  dokploy-network:
    external: true